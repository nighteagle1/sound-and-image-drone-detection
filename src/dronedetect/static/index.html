<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обнаружение дронов</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Обнаружение дронов</h1>

  <nav class="tabs" role="tablist">
    <button id="tab-audio" class="tab active" role="tab" data-mode="audio">Звук</button>
    <button id="tab-vision" class="tab" role="tab" data-mode="vision">Изображение</button>
  </nav>
  <p id="unavailable" class="notice" hidden></p>

  <section class="card controls">
    <div class="row">
      <span class="label">Источник:</span>
      <label><input type="radio" name="kind" value="device" checked> <span id="device-label">Микрофон</span></label>
      <label><input type="radio" name="kind" value="file"> Файл</label>
    </div>
    <div class="row">
      <select id="device" aria-label="Устройство"></select>
      <input id="file" type="file" hidden>
    </div>
    <div class="row">
      <label for="threshold" class="label">Порог:</label>
      <input id="threshold" type="range" min="0" max="1" step="0.01" value="0.5">
      <output id="threshold-value">0.50</output>
    </div>
    <div class="row buttons">
      <button id="start" class="primary">Старт</button>
      <button id="stop">Стоп</button>
      <span id="state" class="state">Остановлено</span>
    </div>
  </section>

  <p id="error" class="error" role="alert" hidden></p>

  <section id="panel-audio" class="card">
    <div id="indicator" class="indicator off">дрон не обнаружен</div>
    <div class="prob">вероятность: <strong id="prob">—</strong></div>
    <canvas id="chart" width="640" height="160" aria-label="График вероятности за 30 секунд"></canvas>
    <div class="hint">График вероятности за последние 30 с, пунктир — порог</div>
  </section>

  <section id="panel-vision" class="card" hidden>
    <div class="video-wrap"><img id="video" alt="Видео с рамками"></div>
    <div class="stats">FPS: <strong id="fps">—</strong> · Найдено: <strong id="count">—</strong></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
